# Local development & hardware-simulator overlay.
# Usage:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml --env-file deploy/.env up -d
#
# Exposes local HTTP ports, enables OpenAPI Swagger/Scalar docs, and runs:
#   - mailpit (local SMTP + Web UI at :8025 to inspect invite/reset/alarm emails)
#   - sim-modbus (Modbus TCP server simulator on wiredeck-runners for Phase 3/4 testing)
#   - sim-vnc (password-protected Xvfb+x11vnc target on wiredeck-runners for Phase 2 testing)

services:
  core-iam:
    environment:
      ENABLE_OPENAPI_DOCS: "true"
      COOKIE_SECURE: "false"
      PUBLIC_BASE_URL: http://localhost:5173
    ports:
      - "127.0.0.1:8081:8080"

  webview-engine:
    environment:
      ENABLE_OPENAPI_DOCS: "true"
    ports:
      - "127.0.0.1:8082:8080"

  webvnc-proxy:
    environment:
      ENABLE_OPENAPI_DOCS: "true"
    ports:
      - "127.0.0.1:8083:8080"

  postgres-oltp:
    ports:
      - "127.0.0.1:5432:5432"

  postgres-tsdb:
    ports:
      - "127.0.0.1:5433:5432"

  mailpit:
    image: axllent/mailpit:v1.24
    container_name: wiredeck2-dev-mailpit
    networks: [wiredeck-control]
    ports:
      - "127.0.0.1:8025:8025"

  sim-modbus:
    image: oitc/modbus-server:latest
    container_name: wiredeck2-dev-sim-modbus
    networks: [wiredeck-runners]

  sim-vnc:
    image: dorowu/ubuntu-desktop-lxde-vnc:focal
    container_name: wiredeck2-dev-sim-vnc
    networks: [wiredeck-runners]
    environment:
      VNC_PASSWORD: dev-vnc-password
