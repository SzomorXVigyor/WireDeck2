server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache index.html so new releases take effect immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Content-hashed Vite assets can be cached immutably
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback for Operator, Site Admin, and Platform Admin routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
